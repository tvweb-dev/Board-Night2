<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar | Board Night</title>
  <link rel="icon" type="image/svg+xml" href="css/design_elements/BNlogo.svg" />
  <link rel="stylesheet" href="https://use.typekit.net/oga8xpj.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main class="container">
    <div class="page-heading"><div><h1>Calendar</h1><p class="subtle">Events you host or have been invited to, organized by date.</p></div></div>
    <div class="calendar-legend"><span><i class="is-upcoming"></i> Upcoming</span><span><i class="is-past"></i> Past</span><span><i class="is-cancelled"></i> Cancelled</span></div>
    <div id="calendarList"><p class="empty">Loading calendar...</p></div>
  </main>
  <script src="js/data.js"></script><script src="js/app.js"></script>
  <script>
    ready(async function () {
      if (!requireSession()) return;
      renderTopbar();
      const list = document.getElementById("calendarList");
      try {
        const events = (await DB.getAllEvents()).filter(function (event) { return event.date; });
        const today = new Date();
        let viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
        let selectedDate = keyFor(today.getFullYear(), today.getMonth(), today.getDate());
        function keyFor(year, month, day) { return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`; }
        function stateClass(event) {
          const state = eventDisplayState(event);
          return state.cancelled ? "is-cancelled" : state.past ? "is-past" : "is-upcoming";
        }
        function calendarEventCard(event, index) {
          const state = eventDisplayState(event);
          const label = state.cancelled ? "Cancelled" : state.past ? "Past" : "Upcoming";
          const hostTag = String(event.hostId) === String(DB.currentUserId()) ? '<span class="host-tag">Host</span>' : "";
          const attendeeId = `calendarAttendees-${event.id}`;
          return `<article class="card calendar-event ${stateClass(event)}">
            <a class="calendar-event-link" href="event.html?event=${encodeURIComponent(event.id)}"><span class="event-swatch" style="--event-color:${["#36996f", "#9b3f45", "#8fb0c7", "#e29314"][index % 4]}"></span><span><strong class="calendar-event-title">${esc(event.title)} ${hostTag}</strong><small>${esc(event.time || "Time TBD")} · ${esc(event.groupName)}</small><small>${esc(event.location || "Location TBD")} · ${label}</small></span></a>
            <button class="calendar-attendee-toggle" type="button" data-event-attendees="${esc(event.id)}" aria-expanded="false" aria-controls="${attendeeId}">Who’s going? <span aria-hidden="true">⌄</span></button>
            <div class="calendar-attendees" id="${attendeeId}" hidden></div>
          </article>`;
        }
        function attendeeRows(rsvps) {
          const unique = new Map();
          rsvps.forEach(function (rsvp) { unique.set(String(rsvp.userId), rsvp); });
          const people = Array.from(unique.values());
          if (!people.length) return '<p class="empty">Nobody has been invited yet.</p>';
          const labels = { going: "Going", maybe: "Maybe", no: "Can’t go", pending: "No response" };
          return people.map(function (person) {
            const status = labels[person.status] ? person.status : "pending";
            return `<div class="calendar-attendee-row">${avatarHtml(person, "calendar-attendee-avatar")}<a class="person-link" href="profile.html?user=${encodeURIComponent(person.userId)}">${esc(person.userName || person.userEmail || `User ${person.userId}`)}</a><span class="pill ${status}">${labels[status]}</span></div>`;
          }).join("");
        }
        function renderCalendar() {
          const year = viewDate.getFullYear(), month = viewDate.getMonth();
          const firstDay = new Date(year, month, 1).getDay();
          const days = new Date(year, month + 1, 0).getDate();
          const cells = Array.from({ length: firstDay }, function () { return '<span class="calendar-cell is-empty"></span>'; });
          for (let day = 1; day <= days; day += 1) {
            const key = keyFor(year, month, day);
            const dotClasses = Array.from(new Set(events.filter(function (event) { return event.date === key; }).map(stateClass)));
            const dots = dotClasses.map(function (className) { return `<i class="${className}"></i>`; }).join("");
            cells.push(`<button class="calendar-cell ${key === selectedDate ? "is-selected" : ""}" data-date="${key}"><span>${day}</span><span class="calendar-dots">${dots}</span></button>`);
          }
          const dayEvents = events.filter(function (event) { return event.date === selectedDate; });
          list.innerHTML = `<div class="calendar-layout"><section class="month-calendar"><div class="month-nav"><button data-month="-1">‹</button><strong>${viewDate.toLocaleDateString(undefined, { month: "long", year: "numeric" })}</strong><button data-month="1">›</button></div><div class="weekday-row">${["S", "M", "T", "W", "T", "F", "S"].map(function (day) { return `<span>${day}</span>`; }).join("")}</div><div class="month-grid">${cells.join("")}</div></section>
            <section class="selected-day"><h2>${prettyDate(selectedDate)}</h2><h3 class="section-label">Group Events</h3><div>${dayEvents.length ? dayEvents.map(calendarEventCard).join("") : '<p class="empty">No group events this day.</p>'}</div></section></div>`;
        }
        list.addEventListener("click", async function (event) {
          const attendeeButton = event.target.closest("[data-event-attendees]");
          if (attendeeButton) {
            const panel = document.getElementById(attendeeButton.getAttribute("aria-controls"));
            const opening = panel.hidden;
            panel.hidden = !opening;
            attendeeButton.setAttribute("aria-expanded", String(opening));
            if (opening && !panel.dataset.loaded) {
              panel.innerHTML = '<p class="subtle">Loading invitees...</p>';
              try { panel.innerHTML = attendeeRows(await DB.getRsvps(attendeeButton.dataset.eventAttendees)); panel.dataset.loaded = "true"; }
              catch (error) { panel.innerHTML = `<p class="empty">${esc(error.message)}</p>`; }
            }
            return;
          }
          const monthButton = event.target.closest("[data-month]");
          if (monthButton) { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + Number(monthButton.dataset.month), 1); selectedDate = keyFor(viewDate.getFullYear(), viewDate.getMonth(), 1); renderCalendar(); return; }
          const dayButton = event.target.closest("[data-date]"); if (dayButton) { selectedDate = dayButton.dataset.date; renderCalendar(); }
        });
        renderCalendar();
      } catch (error) { list.innerHTML = `<p class="empty">${esc(error.message)}</p>`; }
    });
  </script>
</body>
</html>
