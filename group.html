<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Board Night - Group</title>
  <link rel="icon" type="image/svg+xml" href="css/design_elements/BNFavicon.svg" />
  <link rel="stylesheet" href="https://use.typekit.net/oga8xpj.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="container">
    <p class="back-link"><a href="dashboard.html">‹ Back to Groups</a></p>
    <img class="group-cover-image" id="groupCoverImage" alt="" hidden>
    <div class="group-title"><span class="group-title-swatch" id="groupTitleImage"></span><h1 id="groupName">Group</h1></div>
    <div class="group-lifecycle-banner" id="groupLifecycleBanner" hidden></div>
    <div class="group-detail-layout">
      <section class="group-events-column">
        <div class="section-heading"><h2>Events</h2><a class="btn small" id="newEventBtn" href="#">+ New Event</a></div>
        <div id="eventList"></div>
      </section>
      <aside class="group-members-column">
        <div class="card group-image-settings" id="groupImageSettings" hidden>
          <h3>Group image</h3><label for="groupImageUrl">Image URL</label><input id="groupImageUrl" type="url" maxlength="500" placeholder="https://example.com/group.jpg"><label for="groupImageFile">Upload group image</label><input class="image-file-input" id="groupImageFile" type="file" accept="image/*"><div class="btn-row"><button class="btn small" id="saveGroupImageBtn">Save image</button></div>
        </div>
        <div class="card group-lifecycle-settings" id="groupLifecycleSettings" hidden><h3>Group status</h3><p class="subtle" id="groupLifecycleHelp"></p><button class="btn small" id="groupLifecycleButton" type="button"></button></div>
        <h2>Members</h2>
        <div class="card member-panel"><ul class="plain" id="memberList"></ul></div>
        <div class="card invite-panel">
      <h3>Add Member</h3>
      <label for="memberName">Existing user ID, email, nickname, or full name</label>
      <input id="memberName" list="friendOptions" placeholder="Search friends or enter user details" autocomplete="off" />
      <datalist id="friendOptions"><option value="" label="Type to search friends"></option></datalist>
      <div class="btn-row">
        <button class="btn" id="addMemberBtn">Add member</button>
      </div>
        </div>
      </aside>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/game-picker.js"></script>
  <script>
    ready(async function () {
      if (!requireSession()) return;
      renderTopbar();
      const groupId = qs("group");
      const group = await DB.getGroup(groupId);

      if (!group) {
        document.querySelector(".container").innerHTML =
          '<p class="empty">Group not found. <a href="dashboard.html">Go back</a></p>';
        return;
      }
      let groupEvents = await DB.getEvents(groupId);
      const canRemoveMembers = String(group.hostId) === String(DB.currentUserId()) || groupEvents.some(function (event) { return String(event.hostId) === String(DB.currentUserId()) && eventDisplayState(event).upcoming; });

      document.getElementById("groupName").textContent = group.name;
      if (!group.active) {
        const banner = document.getElementById("groupLifecycleBanner");
        banner.textContent = "This group is inactive. Its members and events are kept for history.";
        banner.hidden = false;
        document.getElementById("newEventBtn").hidden = true;
        document.querySelector(".invite-panel").hidden = true;
      }
      const groupCover = document.getElementById("groupCoverImage");
      const groupTitleImage = document.getElementById("groupTitleImage");
      function renderGroupImage() { const image = group.imageUrl || PLACEHOLDER_IMAGE.group; groupCover.src = image; groupCover.hidden = false; groupTitleImage.innerHTML = `<img src="${esc(image)}" alt="">`; }
      renderGroupImage();
      if (String(group.hostId) === String(DB.currentUserId())) {
        document.getElementById("groupImageSettings").hidden = false;
        document.getElementById("groupImageUrl").value = group.imageUrl || "";
        bindImageUpload("groupImageFile", "groupImageUrl", "group");
        document.getElementById("saveGroupImageBtn").addEventListener("click", async function () {
          const button = this; button.disabled = true;
          try { const saved = await DB.updateGroupImage(group.id, document.getElementById("groupImageUrl").value.trim()); group.imageUrl = saved.GROUP_IMAGE_URL || ""; renderGroupImage(); }
          catch (error) { alert(error.message); }
          finally { button.disabled = false; }
        });
        const lifecycleSettings = document.getElementById("groupLifecycleSettings");
        const lifecycleButton = document.getElementById("groupLifecycleButton");
        lifecycleSettings.hidden = false;
        document.getElementById("groupLifecycleHelp").textContent = group.active ? "Inactive groups remain available as history." : "Reactivating creates a new active group with a new group ID and the same members.";
        lifecycleButton.textContent = group.active ? "Set group as inactive" : "Reactivate as new group";
        lifecycleButton.classList.toggle("danger", group.active);
        lifecycleButton.addEventListener("click", async function () {
          const prompt = group.active ? "Set this group as inactive?" : "Reactivate this group as a new group with the same members?";
          if (!confirm(prompt)) return;
          lifecycleButton.disabled = true;
          try {
            if (group.active) { await DB.setGroupInactive(group.id); location.reload(); }
            else { const created = await DB.reactivateGroup(group.id); location.href = `group.html?group=${encodeURIComponent(created.GROUP_ID)}`; }
          } catch (error) { alert(error.message); lifecycleButton.disabled = false; }
        });
      }
      document.getElementById("newEventBtn").href =
        "event-edit.html?group=" + encodeURIComponent(groupId);

      async function renderMembers() {
        const ul = document.getElementById("memberList");
        const members = await DB.getMembers(groupId);

        ul.innerHTML = members.length ? members.map(function (m) {
          const isCreator = String(m.id) === String(group.hostId);
          const creatorTag = isCreator ? '<span class="creator-tag">Creator</span>' : '';
          const canRemove = canRemoveMembers && !isCreator && String(m.id) !== String(DB.currentUserId());
          const removeButton = canRemove ? `<button class="btn danger small member-remove-button" type="button" data-remove-member="${esc(m.id)}" data-member-name="${esc(m.name)}" aria-label="Remove ${esc(m.name)} from group">Remove</button>` : "";
          return `<li class="member-row">${avatarHtml(m, "member-avatar")}<span><span class="member-name-line"><a class="person-link" href="profile.html?user=${encodeURIComponent(m.id)}"><strong>${esc(m.name)}</strong></a>${creatorTag}</span><small>${isCreator ? 'Group creator' : 'Member'}</small></span>${removeButton}</li>`;
        }).join("") : '<li class="empty">No members yet.</li>';
      }

      async function renderFriendOptions() {
        const friends = await DB.getFriends();
        const options = friends.map(function (friend) {
          const label = `${friend.name} [ID ${friend.id}]`;
          return `<option value="${esc(label)}"></option>`;
        });
        document.getElementById("friendOptions").innerHTML = '<option value="" label="Type to search friends"></option>' + options.join("");
      }

      async function renderEvents() {
        const wrap = document.getElementById("eventList");
        const events = groupEvents.slice();
        events.sort(function (a, b) {
          const aDate = eventDateTime(a);
          const bDate = eventDateTime(b);
          return (bDate ? bDate.getTime() : 0) - (aDate ? aDate.getTime() : 0);
        });

        if (!events.length) {
          wrap.innerHTML = '<p class="empty">No events yet.</p>';
          return;
        }

        const cards = await Promise.all(events.map(async function (e) {
          const going = (await DB.getRsvps(e.id)).filter(function (r) {
            return r.status === "going";
          }).length;
          const displayState = eventDisplayState(e);
          const stateLabel = displayState.cancelled ? "Canceled" : displayState.past ? "Past" : "Upcoming";
          const stateClass = displayState.cancelled ? "cancelled" : displayState.past ? "past" : "active";
          const borderClass = displayState.cancelled ? "is-cancelled" : displayState.past ? "is-past" : "is-upcoming";

          return `<a class="card group-event-card ${borderClass}" style="text-decoration:none;color:inherit;display:flex;"
                     href="event.html?event=${encodeURIComponent(e.id)}">
                    <span class="group-event-swatch"><img src="${esc(e.imageUrl || PLACEHOLDER_IMAGE.event)}" alt=""></span><span><h3>${esc(e.title)} <small class="pill ${stateClass}">${stateLabel}</small></h3><p class="subtle">${prettyDate(e.date)} · ${esc(e.time || "Time TBD")} · ${esc(e.location || "Location TBD")}</p>${e.game ? `<span class="group-event-game"><img src="${esc(GamePicker.imageUrl(e.game))}" alt=""><span><strong>${esc(e.game.GAME_NAME)}</strong><small>${esc(GamePicker.compactMeta(e.game).join(" · "))}</small></span></span>` : ""}<strong class="going-label">${going} going</strong></span>
                  </a>`;
        }));

        wrap.innerHTML = cards.join("");
        wrap.querySelectorAll(".group-event-game img").forEach(function (image) { image.addEventListener("error", function () { image.onerror = null; image.src = PLACEHOLDER_IMAGE.event; }); });
        events.forEach(function (event) {
          if (!event.description) return;
          const preview = wrap.querySelector('[data-event-description="' + CSS.escape(String(event.id)) + '"]');
          if (preview) preview.textContent = event.description;
        });
      }

      document.getElementById("addMemberBtn").addEventListener("click", async function () {
        const enteredValue = document.getElementById("memberName").value.trim();
        if (!enteredValue) {
          alert("Please enter an existing user ID, email, nickname, or full name.");
          return;
        }
        const selectedFriend = enteredValue.match(/\[ID (\d+)\]$/i);
        const memberQuery = selectedFriend ? selectedFriend[1] : enteredValue;

        try {
          await DB.addMember(groupId, memberQuery);
          document.getElementById("memberName").value = "";
          await renderMembers();
        } catch (error) {
          alert(error.message);
        }
      });
      document.getElementById("memberName").addEventListener("keydown", function (event) {
        if (event.key !== "Enter" || event.isComposing) return;
        event.preventDefault();
        document.getElementById("addMemberBtn").click();
      });
      document.getElementById("memberList").addEventListener("click", async function (event) {
        const button = event.target.closest("[data-remove-member]");
        if (!button || !confirm(`Remove ${button.dataset.memberName} from this group?`)) return;
        button.disabled = true;
        try {
          await DB.removeMember(groupId, button.dataset.removeMember);
          await renderMembers();
        } catch (error) {
          alert(error.message);
          button.disabled = false;
        }
      });

      await renderMembers();
      await renderFriendOptions();
      await renderEvents();
    });
  </script>
</body>
</html>
