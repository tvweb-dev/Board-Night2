<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Board Night - Create Account</title>
  <link rel="stylesheet" href="https://use.typekit.net/oga8xpj.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="container login-container">
    <h1 class="login-brand"><img class="brand-logo" src="css/design_elements/BNlogo.svg" alt="Board Night logo">Board Night</h1>
    <p class="subtle" style="text-align:center;">Create an account to start planning game nights.</p>

    <form class="card" id="createAccountForm">
      <h3>Create account</h3>
      <p class="subtle">Your account will be saved to the Board Night database.</p>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required />

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Enter your password again" required />

      <p class="form-error" id="formError" role="alert" aria-live="polite"></p>
      <div class="btn-row">
        <button class="btn" id="createAccountBtn" type="submit">Create account</button>
        <a class="btn secondary" href="index.html">Back to sign in</a>
      </div>
    </form>

    <footer class="note">Board Night is connected to the production API server.</footer>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    ready(function () {
      const form = document.getElementById("createAccountForm");
      const submitButton = document.getElementById("createAccountBtn");
      const errorMessage = document.getElementById("formError");

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        errorMessage.textContent = "";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
          errorMessage.textContent = "Passwords do not match.";
          document.getElementById("confirmPassword").focus();
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Creating account...";

        try {
          await DB.register(email, password);
          window.location.href = "dashboard.html";
        } catch (error) {
          errorMessage.textContent = error.message;
          submitButton.disabled = false;
          submitButton.textContent = "Create account";
        }
      });
    });
  </script>
</body>
</html>
