<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events | Board Night</title>
  <link rel="icon" type="image/svg+xml" href="css/design_elements/BNlogo.svg" />
  <link rel="stylesheet" href="https://use.typekit.net/oga8xpj.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main class="container">
    <div class="page-heading">
      <div><h1>Events</h1><p class="subtle">Events from all of your groups.</p></div>
    </div>
    <div id="eventList" class="grid"><p class="empty">Loading events...</p></div>
  </main>
  <script src="js/data.js"></script><script src="js/app.js"></script>
  <script>
    ready(async function () {
      if (!requireSession()) return;
      renderTopbar();
      const list = document.getElementById("eventList");
      try {
        const events = await DB.getAllEvents();
        const cards = await Promise.all(events.map(async function (event, index) {
          const rsvps = await DB.getRsvps(event.id);
          const mine = rsvps.find(function (rsvp) { return String(rsvp.userId) === String(DB.currentUserId()); });
          const going = rsvps.filter(function (rsvp) { return rsvp.status === "going"; });
          return `<article class="card event-card" style="--event-color:${["#36996f", "#9b3f45", "#8fb0c7", "#e29314"][index % 4]}">
            <div class="event-card-head"><span class="event-swatch"></span><div><a href="event.html?event=${encodeURIComponent(event.id)}"><h3>${esc(event.title)}</h3></a><p class="subtle">${esc(event.groupName)} · ${prettyDate(event.date)} · ${esc(event.time || "Time TBD")}</p></div></div>
            <p class="event-location">${esc(event.location || "Location TBD")}</p>
            <div class="rsvp-segments" data-event-id="${esc(event.id)}">${["going", "maybe", "no"].map(function (status) { return `<button class="${mine && mine.status === status ? "is-selected " : ""}${status}" data-status="${status}">${status === "going" ? "Yes" : status === "maybe" ? "Maybe" : "No"}</button>`; }).join("")}</div>
            <div class="event-attendance"><span class="avatar-stack">${going.slice(0, 4).map(function (person, avatarIndex) { return avatarHtml(person, "attendance-avatar", `--avatar-color:${["#ce3b30", "#e29314", "#8fb0c7", "#36996f"][avatarIndex % 4]}`); }).join("")}</span><strong>${going.length} going</strong></div>
          </article>`;
        }));
        list.innerHTML = cards.length ? cards.join("") : '<p class="empty">No events yet. Create one from a group.</p>';
        list.addEventListener("click", async function (clickEvent) {
          const button = clickEvent.target.closest(".rsvp-segments button"); if (!button) return;
          const segments = button.closest(".rsvp-segments");
          await DB.setRsvp(segments.dataset.eventId, DB.currentUserId(), button.dataset.status);
          segments.querySelectorAll("button").forEach(function (item) { item.classList.toggle("is-selected", item === button); });
        });
      } catch (error) { list.innerHTML = `<p class="empty">${esc(error.message)}</p>`; }
    });
  </script>
</body>
</html>
