<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Board Night - Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="css/design_elements/BNlogo.svg" />
  <link rel="stylesheet" href="https://use.typekit.net/oga8xpj.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="container">
    <div class="page-heading"><div><h1>Groups</h1><p class="subtle">Your board game groups and players.</p></div><button class="btn" id="openGroupModal">+ New Group</button></div>
    <div id="groupList" class="grid group-grid"></div>
    <footer class="note">Connected to the Board Night Express API.</footer>
  </main>

  <div class="modal-backdrop" id="groupModal" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="newGroupTitle">
      <h2 id="newGroupTitle">New Group</h2>
      <label for="groupName">Group name</label>
      <input id="groupName" placeholder="Sunday Boardgamers" />
      <label for="groupImageUrl">Group image URL</label>
      <input id="groupImageUrl" type="url" maxlength="500" placeholder="https://example.com/group.jpg" />
      <label for="newGroupImageFile">Upload group image</label>
      <input class="image-file-input" id="newGroupImageFile" type="file" accept="image/*" />
      <div class="btn-row">
        <button class="btn secondary" id="closeGroupModal">Cancel</button>
        <button class="btn" id="createGroupBtn">Create group</button>
      </div>
    </section>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    ready(function () {
      if (!requireSession()) return;
      renderTopbar();
      bindImageUpload("newGroupImageFile", "groupImageUrl", "group");

      async function renderGroups() {
        const list = document.getElementById("groupList");
        list.innerHTML = '<p class="empty">Loading groups...</p>';

        const groups = await DB.getGroups();
        if (!groups.length) {
          list.innerHTML = '<p class="empty">No groups yet - create one above.</p>';
          return;
        }

        const cards = await Promise.all(groups.map(async function (g, groupIndex) {
          const members = await DB.getMembers(g.id);
          const memberCount = members.length;
          const eventCount = (await DB.getEvents(g.id)).length;
          const color = ["#36996f", "#9b3f45", "#8fb0c7", "#e29314"][groupIndex % 4];
          const groupImage = g.imageUrl || PLACEHOLDER_IMAGE.group;
          const isCreator = String(g.hostId) === String(DB.currentUserId());
          const creatorTag = isCreator ? '<span class="creator-tag">Creator</span>' : '';
          return `<a class="card group-card" style="--group-color:${color}" href="group.html?group=${encodeURIComponent(g.id)}"><img class="group-card-image" src="${esc(groupImage)}" alt=""><div class="group-card-head"><span class="group-swatch"><img src="${esc(groupImage)}" alt=""></span><div><span class="group-card-title-line"><h3>${esc(g.name)}</h3>${creatorTag}</span><p class="subtle">${memberCount} member${memberCount === 1 ? "" : "s"} · ${eventCount} event${eventCount === 1 ? "" : "s"}</p></div></div><div class="group-avatars">${members.slice(0, 4).map(function (member, index) { return avatarHtml(member, "group-avatar", `--avatar-color:${["#ce3b30", "#e29314", "#8fb0c7", "#36996f"][index % 4]}`); }).join("")}</div></a>`;
        }));

        list.innerHTML = cards.join("");
      }

      document.getElementById("createGroupBtn").addEventListener("click", async function () {
        const name = document.getElementById("groupName").value.trim();
        const imageUrl = document.getElementById("groupImageUrl").value.trim();
        if (!name) {
          alert("Please enter a group name.");
          return;
        }

        try {
          await DB.createGroup(name, imageUrl);
          document.getElementById("groupName").value = "";
          document.getElementById("groupImageUrl").value = "";
          document.getElementById("groupModal").hidden = true;
          await renderGroups();
        } catch (error) {
          alert(error.message);
        }
      });
      const modal = document.getElementById("groupModal");
      document.getElementById("openGroupModal").addEventListener("click", function () { modal.hidden = false; document.getElementById("groupName").focus(); });
      document.getElementById("closeGroupModal").addEventListener("click", function () { modal.hidden = true; });
      modal.addEventListener("click", function (event) { if (event.target === modal) modal.hidden = true; });

      renderGroups().catch(function (error) {
        document.getElementById("groupList").innerHTML =
          '<p class="empty">' + esc(error.message) + '</p>';
      });
    });
  </script>
</body>
</html>
