<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | Board Night</title>
  <link rel="icon" type="image/svg+xml" href="css/design_elements/BNFavicon 1.svg" />
  <link rel="stylesheet" href="https://use.typekit.net/oga8xpj.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main class="container profile-page">
    <div id="profileStatus" class="profile-loading">Loading profile...</div>
    <section id="profileContent" hidden>
      <header class="profile-header">
        <div class="profile-avatar" id="profileAvatar"></div>
        <div class="profile-heading"><p class="section-label" id="profileEyebrow">Player profile</p><h1 id="profileName">Player</h1><p class="subtle" id="profileEmail"></p></div>
        <button class="btn secondary" id="editProfileBtn" type="button" hidden>Edit profile</button>
      </header>

      <div class="profile-details" id="profileDetails"></div>
      <section class="profile-favorite-games" aria-labelledby="favoriteGamesHeading">
        <h2 id="favoriteGamesHeading">Favorite games</h2>
        <div class="favorite-game-cards" id="favoriteGameCards"></div>
      </section>

      <form class="profile-form" id="profileForm" hidden>
        <div class="profile-form-grid">
          <div><label for="firstName">First name</label><input id="firstName" maxlength="100" required></div>
          <div><label for="lastName">Last name</label><input id="lastName" maxlength="100" required></div>
          <div><label for="nickname">Nickname</label><input id="nickname" maxlength="100" required></div>
          <div class="profile-field-wide"><label for="imageUrl">Profile image URL</label><input id="imageUrl" type="url" maxlength="500" placeholder="https://example.com/photo.jpg"></div>
          <div class="profile-field-wide"><label for="profileImageFile">Upload profile image</label><input class="image-file-input" id="profileImageFile" type="file" accept="image/*"></div>
          <div><label for="birthday">Birthday</label><input id="birthday" type="date" required></div>
          <div><label for="city">City</label><input id="city" maxlength="100" required></div>
          <div><label for="province">Province / State</label><input id="province" maxlength="100" required></div>
          <div><label for="country">Country</label><input id="country" maxlength="100" required></div>
          <div><label for="favoriteFood">Favorite food</label><input id="favoriteFood" maxlength="100" required></div>
          <div><label for="favoriteDrink">Favorite drink</label><input id="favoriteDrink" maxlength="100" required></div>
          <div class="profile-field-wide"><label for="allergies">Allergies</label><input id="allergies" maxlength="255" required></div>
        </div>
        <fieldset class="favorite-games-fieldset">
          <legend>Favorite games</legend>
          <p class="subtle">Search the game catalogue to add favorites. Changes are saved immediately.</p>
          <div id="favoriteGamePicker"></div>
          <div class="favorite-game-edit-list" id="favoriteGameEditList"></div>
          <p class="form-error" id="favoriteGameError" role="status" aria-live="polite"></p>
        </fieldset>
        <p class="form-error" id="profileError" role="alert"></p>
        <div class="btn-row"><button class="btn" type="submit">Save profile</button><button class="btn secondary" id="cancelProfileBtn" type="button">Cancel</button></div>
      </form>
    </section>
  </main>
  <script src="js/data.js"></script><script src="js/app.js"></script><script src="js/game-picker.js"></script>
  <script>
    ready(async function () {
      if (!requireSession()) return;
      renderTopbar();
      const me = DB.currentUser();
      const userId = qs("user") || me.id;
      const isOwner = String(userId) === String(me.id);
      const status = document.getElementById("profileStatus");
      const content = document.getElementById("profileContent");
      const form = document.getElementById("profileForm");
      const details = document.getElementById("profileDetails");
      const fields = ["firstName", "lastName", "nickname", "imageUrl", "birthday", "favoriteFood", "favoriteDrink", "allergies", "city", "province", "country"];
      const keys = { firstName: "FIRST_NAME", lastName: "LAST_NAME", nickname: "NICKNAME", imageUrl: "IMAGE_URL", birthday: "BIRTHDAY", favoriteFood: "FAVORITE_FOOD", favoriteDrink: "FAVORITE_DRINK", allergies: "ALLERGIES", city: "CITY", province: "PROVINCE", country: "COUNTRY" };
      let profile;
      let favoriteGames = [];
      let favoritePicker;

      function value(key) { return profile[key] == null ? "" : String(profile[key]); }
      function displayName() { return value("NICKNAME") || [value("FIRST_NAME"), value("LAST_NAME")].filter(Boolean).join(" ") || value("EMAIL") || `User ${userId}`; }
      function renderAvatar() {
        const avatar = document.getElementById("profileAvatar");
        const image = value("IMAGE_URL") || PLACEHOLDER_IMAGE.profile;
        avatar.innerHTML = `<img src="${esc(image)}" alt="${esc(displayName())}">`;
      }
      function detail(label, text) { return text ? `<div class="profile-detail"><span>${esc(label)}</span><strong>${esc(text)}</strong></div>` : ""; }
      function gameMeta(game) { return GamePicker.compactMeta(game).join(" · ") || game.CATEGORY || "Board game"; }
      function renderFavoriteGames() {
        const cards = document.getElementById("favoriteGameCards");
        cards.innerHTML = favoriteGames.length ? favoriteGames.map(function (game) {
          return `<article class="favorite-game-card"><img src="${esc(GamePicker.imageUrl(game))}" alt="${esc(game.GAME_NAME)} cover"><div><strong>${esc(game.GAME_NAME)}</strong><small>${esc(gameMeta(game))}</small>${GamePicker.rating(game) ? `<small>${esc(GamePicker.rating(game))}</small>` : ""}</div></article>`;
        }).join("") : '<p class="empty">No favorite games selected yet.</p>';
        cards.querySelectorAll("img").forEach(function (image) { image.addEventListener("error", function () { image.src = PLACEHOLDER_IMAGE.event; }); });
        renderFavoriteEditList();
      }
      function renderFavoriteEditList() {
        const list = document.getElementById("favoriteGameEditList");
        list.innerHTML = favoriteGames.length ? favoriteGames.map(function (game) {
          return `<div class="favorite-game-edit-row"><img src="${esc(GamePicker.imageUrl(game))}" alt=""><span><strong>${esc(game.GAME_NAME)}</strong><small>${esc(gameMeta(game))}</small></span><button class="btn secondary small" type="button" data-remove-game="${Number(game.GAME_ID)}" aria-label="Remove ${esc(game.GAME_NAME)} from favorites">Remove</button></div>`;
        }).join("") : '<p class="empty">Search above to add your first favorite.</p>';
        list.querySelectorAll("img").forEach(function (image) { image.addEventListener("error", function () { image.src = PLACEHOLDER_IMAGE.event; }); });
      }
      async function saveFavoriteGames(nextGames) {
        const error = document.getElementById("favoriteGameError");
        error.textContent = "";
        try {
          await DB.replaceFavoriteGames(me.id, nextGames.map(function (game) { return Number(game.GAME_ID); }));
          favoriteGames = nextGames;
          renderFavoriteGames();
          return true;
        } catch (saveError) {
          error.textContent = saveError.message;
          return false;
        }
      }
      function render() {
        document.getElementById("profileName").textContent = displayName();
        document.getElementById("profileEmail").textContent = value("EMAIL");
        document.getElementById("profileEyebrow").textContent = isOwner ? "Your player profile" : "Player profile";
        renderAvatar();
        const location = [value("CITY"), value("PROVINCE"), value("COUNTRY")].filter(Boolean).join(", ");
        const birthday = value("BIRTHDAY") ? prettyDate(value("BIRTHDAY").slice(0, 10)) : "";
        details.innerHTML = detail("Name", [value("FIRST_NAME"), value("LAST_NAME")].filter(Boolean).join(" ")) + detail("Nickname", value("NICKNAME")) + detail("Location", location) + detail("Birthday", birthday) + detail("Favorite food", value("FAVORITE_FOOD")) + detail("Favorite drink", value("FAVORITE_DRINK")) + detail("Allergies", value("ALLERGIES"));
        if (!details.innerHTML) details.innerHTML = `<p class="empty">${isOwner ? "Add some details so your group can get to know you." : "This player has not added profile details yet."}</p>`;
        renderFavoriteGames();
        document.getElementById("editProfileBtn").hidden = !isOwner;
      }
      function beginEdit(scrollToForm) {
        if (!isOwner) return;
        fields.forEach(function (field) { const raw = value(keys[field]); document.getElementById(field).value = field === "birthday" ? raw.slice(0, 10) : raw; });
        renderFavoriteEditList();
        details.hidden = true; form.hidden = false; document.getElementById("editProfileBtn").hidden = true;
        if (scrollToForm) {
          requestAnimationFrame(function () {
            const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            form.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
          });
        }
      }
      function cancelEdit() { form.hidden = true; details.hidden = false; document.getElementById("editProfileBtn").hidden = !isOwner; document.getElementById("profileError").textContent = ""; renderAvatar(); }

      try {
        [profile, favoriteGames] = await Promise.all([DB.getProfile(userId), DB.getFavoriteGames(userId)]);
        status.hidden = true; content.hidden = false; render();
        if (isOwner) {
          favoritePicker = GamePicker.create(document.getElementById("favoriteGamePicker"), {
            inputId: "favoriteGameSearch",
            label: "Search for a favorite game",
            allowClear: false,
            onSelect: async function (game) {
              if (favoriteGames.some(function (favorite) { return String(favorite.GAME_ID) === String(game.GAME_ID); })) {
                document.getElementById("favoriteGameError").textContent = `${game.GAME_NAME} is already a favorite.`;
              } else {
                await saveFavoriteGames(favoriteGames.concat(game));
              }
              favoritePicker.setSelected(null);
            }
          });
        }
        if (isOwner && !profile.FIRST_NAME && !profile.NICKNAME && !profile.IMAGE_URL) beginEdit();
      } catch (error) { status.textContent = error.message; status.className = "notice"; return; }

      document.getElementById("editProfileBtn").addEventListener("click", function () { beginEdit(true); });
      document.getElementById("cancelProfileBtn").addEventListener("click", cancelEdit);
      document.getElementById("favoriteGameEditList").addEventListener("click", async function (event) {
        const button = event.target.closest("[data-remove-game]");
        if (!button || !isOwner) return;
        button.disabled = true;
        const nextGames = favoriteGames.filter(function (game) { return String(game.GAME_ID) !== button.dataset.removeGame; });
        if (!await saveFavoriteGames(nextGames)) button.disabled = false;
      });
      document.getElementById("imageUrl").addEventListener("input", function (event) { profile.IMAGE_URL = event.target.value.trim(); renderAvatar(); });
      bindImageUpload("profileImageFile", "imageUrl", "profile");
      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        const error = document.getElementById("profileError"); error.textContent = "";
        const payload = {}; fields.forEach(function (field) { payload[field] = document.getElementById(field).value.trim(); });
        try { profile = await DB.saveProfile(userId, payload); form.hidden = true; details.hidden = false; render(); }
        catch (saveError) { error.textContent = saveError.message; }
      });
    });
  </script>
</body>
</html>
