<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friends | Board Night</title>
  <link rel="icon" type="image/svg+xml" href="css/design_elements/BNlogo.svg" />
  <link rel="stylesheet" href="https://use.typekit.net/oga8xpj.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main class="container">
    <div class="page-heading"><div><h1>Friends</h1><p class="subtle">People who share groups with you.</p></div></div>
    <input class="friend-search" id="friendSearch" type="search" placeholder="Search friends" />
    <h2 class="section-label">All Friends</h2>
    <div id="friendList" class="grid"><p class="empty">Loading friends...</p></div>
  </main>
  <script src="js/data.js"></script><script src="js/app.js"></script>
  <script>
    ready(async function () {
      if (!requireSession()) return;
      renderTopbar();
      const list = document.getElementById("friendList");
      try {
        const friends = await DB.getFriends();
        function renderFriends(query) {
          const visible = friends.filter(function (friend) { return friend.name.toLowerCase().includes(query.toLowerCase()); });
          list.innerHTML = visible.length ? visible.map(function (friend, index) {
          const initials = friend.name.split(/\s+/).filter(Boolean).slice(0, 2).map(function (part) { return part[0]; }).join("").toUpperCase();
          return `<article class="card friend-card"><div class="friend-avatar" style="--avatar-color:${["#8fb0c7", "#e29314", "#36996f", "#ce3b30", "#9b3f45"][index % 5]}">${esc(initials)}</div><div><h3>${esc(friend.name)}</h3><p class="subtle">${friend.groups.length} group${friend.groups.length === 1 ? "" : "s"} together</p></div></article>`;
          }).join("") : `<p class="empty">${query ? `No friends match “${esc(query)}”.` : "No shared group members yet."}</p>`;
        }
        renderFriends("");
        document.getElementById("friendSearch").addEventListener("input", function (event) { renderFriends(event.target.value.trim()); });
      } catch (error) { list.innerHTML = `<p class="empty">${esc(error.message)}</p>`; }
    });
  </script>
</body>
</html>
