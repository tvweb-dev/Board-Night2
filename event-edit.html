<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Board Night - Create Event</title>
  <link rel="icon" type="image/svg+xml" href="css/design_elements/BNlogo.svg" />
  <link rel="stylesheet" href="https://use.typekit.net/oga8xpj.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <div class="container">
    <p><a id="backLink" href="dashboard.html">&larr; Back</a></p>
    <h1 id="pageTitle">Create event</h1>
    <p class="subtle">Set time, date and location for a group event.</p>

    <div class="card">
      <label for="title">Event title</label>
      <input id="title" placeholder="e.g. Catan Night" />

      <label for="date">Date</label>
      <input id="date" type="date" />

      <label for="time">Time</label>
      <input id="time" type="time" />

      <label for="location">Location</label>
      <input id="location" placeholder="e.g. Sam's place" />

      <label for="description">Event Description</label>
      <textarea id="description" maxlength="2000" placeholder="Tell your group what the event is about..."></textarea>
      <p class="character-counter" id="descriptionCounter">0 / 2000</p>

      <label for="imageUrl">Event image URL</label>
      <input id="imageUrl" type="url" maxlength="500" placeholder="https://example.com/game-night.jpg" />
      <img class="media-url-preview" id="imagePreview" alt="Event image preview" hidden />

      <div class="btn-row">
        <button class="btn" id="saveBtn">Save event</button>
        <a class="btn secondary" id="cancelBtn" href="dashboard.html">Cancel</a>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    ready(async function () {
      if (!requireSession()) return;
      renderTopbar();
      const groupId = qs("group");
      const eventId = qs("event");
      const rehostId = qs("rehost");
      const existing = eventId ? await DB.getEvent(eventId) : null;
      const rehostSource = rehostId ? await DB.getEvent(rehostId) : null;
      const source = existing || rehostSource;

      if ((eventId || rehostId) && !source) {
        document.querySelector(".container").innerHTML = '<p class="notice">Event not found.</p>';
        return;
      }

      if (rehostSource && String(rehostSource.hostId) !== String(DB.currentUserId())) {
        document.querySelector(".container").innerHTML = '<p class="notice">Only the original host can host this event again.</p>';
        return;
      }

      const back = source
        ? "event.html?event=" + encodeURIComponent(source.id)
        : (groupId ? "group.html?group=" + encodeURIComponent(groupId) : "dashboard.html");

      document.getElementById("backLink").href = back;
      document.getElementById("cancelBtn").href = back;

      if (source) {
        document.getElementById("pageTitle").textContent = rehostSource ? "Host event again" : "Edit event";
        document.getElementById("title").value = source.title;
        document.getElementById("date").value = rehostSource ? "" : source.date;
        document.getElementById("time").value = source.time;
        document.getElementById("location").value = source.location;
        document.getElementById("description").value = source.description || "";
        document.getElementById("imageUrl").value = source.imageUrl || "";
        document.getElementById("descriptionCounter").textContent = (source.description || "").length + " / 2000";
      }
      if (rehostSource) document.getElementById("date").min = new Date().toLocaleDateString("en-CA");

      const descriptionInput = document.getElementById("description");
      const descriptionCounter = document.getElementById("descriptionCounter");
      descriptionInput.addEventListener("input", function () {
        descriptionCounter.textContent = descriptionInput.value.length + " / 2000";
      });
      const imageInput = document.getElementById("imageUrl");
      const imagePreview = document.getElementById("imagePreview");
      function previewImage() { imagePreview.src = imageInput.value.trim(); imagePreview.hidden = !imageInput.value.trim(); }
      imageInput.addEventListener("input", previewImage);
      imagePreview.addEventListener("error", function () { imagePreview.hidden = true; });
      previewImage();

      document.getElementById("saveBtn").addEventListener("click", async function () {
        const saveButton = document.getElementById("saveBtn");
        const fields = {
          title: document.getElementById("title").value.trim(),
          date: document.getElementById("date").value,
          time: document.getElementById("time").value,
          location: document.getElementById("location").value.trim(),
          description: descriptionInput.value.trim(),
          imageUrl: imageInput.value.trim()
        };

        if (!fields.title || !fields.date || !fields.time || !fields.location) {
          alert("Please fill in a title, date, time and location.");
          return;
        }

        if (fields.description.length > 2000) {
          alert("Event Description must be 2000 characters or fewer.");
          return;
        }

        if (rehostSource && (fields.date === rehostSource.date || eventDateTime(fields) <= new Date())) {
          alert("Choose a new upcoming date and time before hosting this event again.");
          return;
        }

        saveButton.disabled = true;
        saveButton.textContent = "Saving...";
        try {
          let saved;
          if (existing) {
            saved = await DB.updateEvent(existing.id, fields);
          } else {
            fields.groupId = rehostSource ? rehostSource.groupId : groupId;
            fields.rehostedFromEventId = rehostSource ? rehostSource.id : null;
            saved = await DB.createEvent(fields);
          }

          document.getElementById("title").value = "";
          document.getElementById("date").value = "";
          document.getElementById("time").value = "";
          document.getElementById("location").value = "";
          descriptionInput.value = "";
          descriptionCounter.textContent = "0 / 2000";
          alert(existing ? "Event updated successfully." : rehostSource ? "A new event was created. The original remains in event history." : "Event created successfully.");
          window.location.href = "event.html?event=" + encodeURIComponent(saved.id);
        } catch (error) {
          alert(error.message);
          saveButton.disabled = false;
          saveButton.textContent = "Save event";
        }
      });
    });
  </script>
</body>
</html>
